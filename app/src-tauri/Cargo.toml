[package]
name = "tokidoki-app"
description = "Tokidoki, the app"
edition.workspace = true
# The app's own version, bumped by scripts/release.sh; the crates keep the workspace's.
version = "0.1.2"
license.workspace = true

[lib]
name = "tokidoki_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
# The Keychain holds the API keys.
keyring = { version = "3", features = ["apple-native"] }
# A picture of the page, taken by its own web view (debug.rs).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tokidoki = { path = "../../crates/tokidoki" }
jev = { path = "../../crates/jev" }
tokio.workspace = true
